name: Deploy PHALI AI-HRIS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil source proyek
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pasang dependensi
        run: npm ci

      - name: Periksa TypeScript
        run: npm run lint

      - name: Jalankan unit test
        run: npm test

      - name: Uji database dan hak akses
        run: npm run test:sql

      - name: Siapkan Edge Functions
        run: npm run prepare:edge

      - name: Siapkan Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Periksa Edge Functions
        run: >
          deno check --node-modules-dir=manual
          supabase/functions/ai-narasi/index.ts
          supabase/functions/ai-chat/index.ts

      - name: Jalankan tes backend
        run: >
          deno test --allow-env --node-modules-dir=manual
          supabase/functions/_shared/core.test.ts

      - name: Periksa konfigurasi frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          node -e "
          if (
            !process.env.VITE_SUPABASE_URL ||
            !process.env.VITE_SUPABASE_ANON_KEY
          ) {
            console.error('Secret Supabase belum lengkap.');
            process.exit(1);
          }
          "

      - name: Build aplikasi
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - name: Siapkan GitHub Pages
        uses: actions/configure-pages@v5

      - name: Unggah hasil build
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Terbitkan aplikasi
        id: deployment
        uses: actions/deploy-pages@v4
